<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT 360 - Registro de Lote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-xl border border-[#E2E8F0] shadow-sm max-w-md w-full space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Crea tu cuenta SaaS</h2>
      <p class="text-sm text-slate-500 mt-1">Automatiza tu lote con PROJECT 360</p>
    </div>
    
    <form id="form-registro" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-500 uppercase">Nombre del Lote</label>
        <input type="text" id="nombre-lote" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]" placeholder="ej. Gomez Automotriz">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 uppercase">Ciudad</label>
        <input type="text" id="ciudad" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]" placeholder="ej. Colima">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 uppercase">Teléfono de WhatsApp del Lote</label>
        <input type="text" id="telefono" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]" placeholder="ej. 523121234567">
      </div>
      <hr class="border-[#E2E8F0]">
      <div>
        <label class="block text-xs font-medium text-slate-500 uppercase">Correo Administrador</label>
        <input type="email" id="email" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]" placeholder="correo@ejemplo.com">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 uppercase">Contraseña de Acceso</label>
        <input type="password" id="password" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]" placeholder="••••••••">
      </div>
      
      <button type="submit" id="btn-registrar" class="w-full bg-[#0F172A] text-white text-sm font-medium py-2.5 rounded-lg hover:bg-slate-800 transition-colors">
        Registrar Lote e Ingresar
      </button>
    </form>
    <p class="text-center text-xs text-slate-400">¿Ya tienes cuenta? <a href="login.html" class="text-slate-900 font-medium underline">Inicia sesión</a></p>
  </div>

  <script src="registro.js"></script>
</body>
</html>
