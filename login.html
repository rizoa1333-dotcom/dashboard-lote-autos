<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto360 - Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-body bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  <div class="login-container bg-white p-8 rounded-xl border border-[#E2E8F0] shadow-sm max-w-md w-full space-y-6">
    <div class="login-header text-center">
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Proyecto360</h2>
      <p class="text-sm text-slate-500 mt-1">Portal de Control Automotriz</p>
    </div>
    
    <form id="form-login" class="login-form space-y-4">
      <div class="input-group">
        <label class="block text-xs font-medium text-slate-500 uppercase">Correo electrónico</label>
        <input type="email" id="email" placeholder="Correo electrónico" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]">
      </div>
      <div class="input-group">
        <label class="block text-xs font-medium text-slate-500 uppercase">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" required class="w-full mt-1 px-3 py-2 rounded-lg border border-[#E2E8F0] text-sm outline-none focus:border-[#0F172A]">
      </div>
      
      <button type="submit" class="btn-primary w-full bg-[#0F172A] text-white text-sm font-medium py-2.5 rounded-lg hover:bg-slate-800 transition-colors" id="btn-submit">
        Iniciar Sesión
      </button>
      <div id="login-error" class="error-message text-xs text-rose-500 text-center" style="display: none;"></div>
    </form>
    
    <p class="text-center text-xs text-slate-400">¿Eres un lote nuevo? <a href="registro.html" class="text-slate-900 font-medium underline">Regístrate aquí</a></p>
  </div>

  <script src="login.js"></script>
</body>
</html>
