<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECTO360 - Administración del Lote</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="flex min-h-screen">
        
        <!-- SIDEBAR (Navegación Izquierda) -->
        <aside class="w-64 bg-white shadow-md p-6 flex flex-col justify-between border-r border-gray-200">
            <div>
                <div class="mb-8">
                    <h1 class="text-xl font-extrabold text-gray-900 tracking-wider">PROYECTO360</h1>
                    <p class="text-xs text-gray-400 mt-1">rizoa1333@gmail.com</p>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="block py-2.5 px-4 text-gray-600 hover:bg-gray-50 rounded-lg font-medium text-sm transition-all">Inventario</a>
                    <a href="#" class="block py-2.5 px-4 bg-gray-900 text-white rounded-lg font-semibold text-sm transition-all shadow-xs">Seguimiento CRM</a>
                </nav>
            </div>
            <div class="space-y-2">
                <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-all cursor-pointer">Activar Alertas</button>
                <button class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2.5 px-4 rounded-lg text-sm transition-all cursor-pointer">+ Nuevo Vehículo</button>
                <button class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-all cursor-pointer">Cerrar Sesión</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 p-8">
            <header class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Administración del Lote</h2>
                <p class="text-sm text-gray-500">Monitoreo y gestión de leads en tiempo real</p>
            </header>

            <!-- TARJETAS DE MÉTRICAS -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Unidades Disponibles</span>
                    <p class="text-3xl font-extrabold text-gray-900 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Valor de Inventario</span>
                    <p class="text-3xl font-extrabold text-gray-900 mt-2">$0 MXN</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-xs border border-gray-200">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Unidades Vendidas</span>
                    <p class="text-3xl font-extrabold text-gray-900 mt-2">0</p>
                </div>
            </section>

            <!-- SECCIÓN: FLUJO DE PROSPECTOS DINÁMICO -->
            <section class="bg-white p-6 rounded-xl shadow-xs border border-gray-200">
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h3 class="text-sm font-bold text-gray-800 tracking-wider uppercase">Flujo de Prospectos</h3>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400 font-medium">Sincronizado en vivo</span>
                        <span class="h-2 w-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    </div>
                </div>

                <!-- Aquí el Javascript inyectará las tarjetas de cada cliente -->
                <div id="contenedor-prospectos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <p class="text-gray-400 text-sm italic col-span-full py-4 text-center">Conectando con el servidor de base de datos...</p>
                </div>
            </section>
        </main>

    </div>

    <!-- Vinculación del archivo lógico de Javascript -->
    <script src="dashboard.js"></script>
</body>
</html>
