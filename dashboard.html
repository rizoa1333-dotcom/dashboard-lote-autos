<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto360 - Centro de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <button id="mobile-menu-btn">☰ Menú</button>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Proyecto360</h2>
                <p id="user-email">Cargando...</p>
            </div>

            <div class="sidebar-section">
                <h3>Navegación</h3>
                <button id="tab-inventario" class="btn-primary btn-tab active-tab" onclick="cambiarVista('vista-inventario', 'tab-inventario')">Inventario</button>
                <button id="tab-citas" class="btn-primary btn-tab" onclick="cambiarVista('vista-citas', 'tab-citas')">Seguimiento CRM</button>
            </div>

            <div class="sidebar-section">
                <h3>Operaciones</h3>
                <button id="btn-alertas" class="btn-primary" style="background: var(--success); color:#FFF; border:none;">Activar Alertas</button>
                <button class="btn-primary" onclick="document.getElementById('form-nuevo-auto').style.display='block'">+ Nuevo Vehículo</button>
                <button id="btn-logout" class="btn-primary" style="background:var(--danger); color:#FFF; border:none;">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-title">
                    <h1>Administración del Lote</h1>
                    <p>Monitoreo y gestión en tiempo real</p>
                </div>
            </header>

            <section class="kpi-row">
                <div class="kpi-card">
                    <h4>Unidades Disponibles</h4>
                    <div class="kpi-value" id="kpi-disponibles">0</div>
                </div>
                <div class="kpi-card">
                    <h4>Valor de Inventario</h4>
                    <div class="kpi-value" id="kpi-valor">$0 MXN</div>
                </div>
                <div class="kpi-card">
                    <h4>Unidades Vendidas</h4>
                    <div class="kpi-value" id="kpi-vendidos">0</div>
                </div>
            </section>

            <div id="vista-inventario" class="view-section active-view">
                <div class="panel-card">
                    <form id="form-nuevo-auto" style="display: none; border: 1px solid var(--border-color); padding: 20px; border-radius: 6px; margin-bottom: 10px;">
                        <h3 style="margin-bottom: 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;">Registrar Nueva Unidad</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                            <div class="input-group"><input type="text" id="auto-marca" placeholder="Marca" required></div>
                            <div class="input-group"><input type="text" id="auto-modelo" placeholder="Modelo" required></div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                            <div class="input-group"><input type="number" id="auto-ano" placeholder="Año" required></div>
                            <div class="input-group"><input type="number" id="auto-precio" placeholder="Precio" required></div>
                        </div>
                        <div class="input-group" style="margin-bottom: 16px;">
                            <input type="url" id="auto-foto" placeholder="URL de la galería de fotos" required>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn-primary" style="flex: 1;">Guardar</button>
                            <button type="button" class="btn-primary" style="background:var(--bg-main); color:var(--text-pure); border-color:var(--border-color); flex: 1;" onclick="document.getElementById('form-nuevo-auto').style.display='none'">Cancelar</button>
                        </div>
                    </form>

                    <div class="card-header">
                        <h2>Inventario Activo</h2>
                        <span class="counter-pill" id="total-autos">0</span>
                    </div>
                    <div class="inventory-grid" id="contenedor-autos"></div>
                </div>
            </div>

            <div id="vista-citas" class="view-section">
                <div class="panel-card">
                    <div class="card-header">
                        <h2>Flujo de Prospectos</h2>
                        <span class="pulse-dot"></span>
                    </div>
                    <div class="citas-container" id="contenedor-citas" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding-top: 10px;">
                        <p style="color: var(--text-muted); font-size: 13px; font-style: italic;">Cargando prospectos en tiempo real...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./dashboard.js"></script>
</body>
</html>
